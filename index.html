<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maison Calme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap">
<style>
:root{
  --panel:rgba(32,30,34,.82); --ink:#F3ECDF; --muted:#BDB2A0; --gold:#D8B878; --line:rgba(243,236,223,.16);
  --chip:#2B282C; --chip-on:#E9DCC3; --chip-on-ink:#221F22;
  --display:'Cormorant Garamond','Times New Roman',Georgia,serif; --body:'Jost','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:#1E1D21;color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;outline:none;touch-action:none}
.card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{top:16px;left:16px;padding:14px 18px;max-width:min(370px,calc(100% - 32px))}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:500}
.brand h1{font-family:var(--display);font-weight:600;font-size:32px;line-height:1;margin:6px 0 2px}
.brand h1 em{font-style:italic;font-weight:500;color:var(--gold)}
.brand h2{font-family:var(--display);font-size:21px;font-weight:600;margin:10px 0 3px;padding-top:10px;border-top:1px solid var(--line)}
.brand p{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.side{top:16px;right:16px;padding:14px 16px;width:230px;display:flex;flex-direction:column;gap:14px}
.side h3{margin:0 0 7px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;background:var(--chip);color:var(--ink);border:0;padding:7px 4px;font:inherit;font-size:12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.btn{width:100%;background:var(--chip-on);color:var(--chip-on-ink);border:0;border-radius:3px;padding:9px;font:inherit;font-weight:500;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
#photoInfo{font-size:12px;color:var(--muted);line-height:1.5;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#D8B878}
#views{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:6px;overflow-x:auto;padding:4px;scrollbar-width:none}
#views button{flex:0 0 auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
#views button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:66px;font-size:12px;background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#1E1D21;font-family:var(--display);font-size:24px;font-style:italic;color:var(--muted);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
.rlabel{text-align:center;pointer-events:none;color:#2F2A24;text-shadow:0 0 6px rgba(255,252,246,.95)}
.rlabel b{display:block;font-size:11px;letter-spacing:.14em;font-weight:500}
.rlabel span{font-size:10.5px;opacity:.85}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">Setting the rooms…</div>
<header class="card brand">
  <div class="eyebrow">Type A · 3 BHK · East facing · 1750 sft</div>
  <h1>Maison <em>Calme</em></h1>
  <h2 id="noteTitle">The whole home</h2>
  <p id="noteText"></p>
</header>
<aside class="card side">
  <div>
    <h3>Light</h3>
    <div class="seg" id="lightSeg">
      <button data-light="morning" aria-pressed="true">Morning</button>
      <button data-light="golden" aria-pressed="false">Golden hour</button>
      <button data-light="evening" aria-pressed="false">Evening</button>
    </div>
  </div>
  <div>
    <h3>Realistic render</h3>
    <button class="btn" id="photoBtn">Render photo</button>
    <p id="photoInfo">Step into a room, then render. The image sharpens over 20–60 seconds. You can still drag to change the angle.</p>
    <div id="photoTools" hidden>
      <h3 style="margin-top:8px">Brightness</h3>
      <input type="range" id="expo" min="0.5" max="2.5" step="0.05" value="1.2">
      <button class="btn ghost" id="saveBtn" style="margin-top:8px">Save image (PNG)</button>
    </div>
  </div>
</aside>
<nav id="views"></nav>
<div id="hint">Drag to orbit · scroll to zoom</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.16/build/index.module.js",
  "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.27/build/index.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

import { WebGLPathTracer } from 'three-gpu-pathtracer';

// 1 unit = 1 foot. x: west→east, z: north→south.
const H = 10;
const V3 = THREE.Vector3;
RectAreaLightUniformsLib.init();

// ---------------- renderer ----------------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

stage.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(stage.clientWidth, stage.clientHeight);
Object.assign(labelRenderer.domElement.style, { position: 'absolute', inset: '0', pointerEvents: 'none' });
stage.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color('#E4DDD2');
scene.background = BG;
const camera = new THREE.PerspectiveCamera(38, stage.clientWidth / stage.clientHeight, 0.1, 800);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(stage.clientWidth, stage.clientHeight), 0.18, 0.4, 0.98);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------- sky (equirect, works for raster + path tracer) ----------------
function makeSky(kind) {
  const w = 512, h = 256, data = new Float32Array(w * h * 4);
  const P = {
    morning: { zen: [0.42, 0.6, 0.95], hor: [1.0, 0.95, 0.88], gnd: [0.42, 0.4, 0.34], k: 1.2, sun: [0.85, 0.35, 0.15], sunC: [1, .93, .8] },
    golden: { zen: [0.35, 0.42, 0.7], hor: [1.0, 0.7, 0.45], gnd: [0.35, 0.28, 0.22], k: 0.9, sun: [-0.9, 0.18, 0.1], sunC: [1, .65, .35] },
    evening: { zen: [0.03, 0.04, 0.09], hor: [0.12, 0.1, 0.16], gnd: [0.03, 0.03, 0.03], k: 0.6, sun: [0, -1, 0], sunC: [0, 0, 0] },
  }[kind];
  const sd = new V3(...P.sun).normalize();
  for (let j = 0; j < h; j++) {
    const el = (0.5 - (j + .5) / h) * Math.PI;  // +pi/2 top
    for (let i = 0; i < w; i++) {
      const az = ((i + .5) / w) * Math.PI * 2 - Math.PI;
      const d = new V3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
      let c;
      if (el >= 0) { const t = Math.pow(Math.min(1, el / (Math.PI / 2)), 0.5); c = P.hor.map((v, k) => v * (1 - t) + P.zen[k] * t); }
      else { const t = Math.min(1, -el * 4); c = P.hor.map((v, k) => v * (1 - t) * .6 + P.gnd[k] * t); }
      const g = Math.max(0, d.dot(sd)); const glow = Math.pow(g, 24) * 2.5 + Math.pow(g, 4) * 0.25;
      const o = (j * w + i) * 4;
      data[o] = (c[0] + P.sunC[0] * glow) * P.k; data[o + 1] = (c[1] + P.sunC[1] * glow) * P.k; data[o + 2] = (c[2] + P.sunC[2] * glow) * P.k; data[o + 3] = 1;
    }

}
const skies = { morning: makeSky('morning'), golden: makeSky('golden'), evening: makeSky('evening') };
scene.environment = skies.morning;
scene.environmentIntensity = 0.35;

// ---------------- seeded random + canvas textures ----------------
let seed = 7;
const R = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, { rot = 0, repeat = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  if (rot) { t.center.set(.5, .5); t.rotation = rot; }
  return t;
}
function veins(g, x0, y0, w, h, colors, count, alphaMax = .4) {
  g.save(); g.beginPath(); g.rect(x0, y0, w, h); g.clip();
  for (let i = 0; i < 24; i++) {
    const x = x0 + R() * w, y = y0 + R() * h, r = Math.max(w, h) * (.08 + R() * .25);
    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(150,130,100,0.06)'); gr.addColorStop(1, 'rgba(150,130,100,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  g.lineCap = 'round';
  for (let i = 0; i < count; i++) {
    let x = x0 + R() * w, y = y0 + R() * h, a = R() * Math.PI * 2;
    g.beginPath(); g.moveTo(x, y);
    const steps = 60 + R() * 90, st = Math.max(w, h) * .012;
    for (let k = 0; k < steps; k++) { a += (R() - .5) * .5; x += Math.cos(a) * st; y += Math.sin(a) * st; g.lineTo(x, y); }
    g.strokeStyle = colors[i % colors.length]; g.globalAlpha = .15 + R() * alphaMax; g.lineWidth = .7 + R() * 2.6;

}
const CALA = ['rgba(120,110,100,1)', 'rgba(176,140,80,1)', 'rgba(140,128,115,1)'];
function marbleTiles(n, base, grout, count = 7) {
  return canvasTex(1024, 1024, (g, s) => {
    const t = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = base; g.fillRect(i * t, j * t, t, t); veins(g, i * t, j * t, t, t, CALA, count); }
    g.strokeStyle = grout; g.lineWidth = 2;
    for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * t, 0); g.lineTo(i * t, s); g.stroke(); g.beginPath(); g.moveTo(0, i * t); g.lineTo(s, i * t); g.stroke(); }
  });
}
function marbleSlab() { return canvasTex(1024, 1024, (g, s) => { g.fillStyle = '#F5F2EC'; g.fillRect(0, 0, s, s); veins(g, 0, 0, s, s, CALA, 26, .5); }); }
function herringbone(hue, light) {
  return canvasTex(1024, 1024, (g, s) => {
    const L = 128, W = 32;
    const plank = (x, y, w, h, horiz) => {
      const l = light + (R() - .5) * 10, hh = hue + (R() - .5) * 5;
      g.fillStyle = `hsl(${hh},36%,${l}%)`; g.fillRect(x, y, w, h);
      g.globalAlpha = .2; g.strokeStyle = `hsl(${hh},30%,${l - 15}%)`; g.lineWidth = 1;
      for (let k = 0; k < 5; k++) { g.beginPath(); if (horiz) { const yy = y + 3 + R() * (h - 6); g.moveTo(x, yy); g.bezierCurveTo(x + w * .3, yy + 2, x + w * .6, yy - 2, x + w, yy + 1); } else { const xx = x + 3 + R() * (w - 6); g.moveTo(xx, y); g.bezierCurveTo(xx + 2, y + h * .3, xx - 2, y + h * .6, xx + 1, y + h); } g.stroke(); }
      g.globalAlpha = 1; g.strokeStyle = 'rgba(60,40,25,.55)'; g.lineWidth = 1.2; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
    };
    for (let j = -10; j <= 10; j++) for (let k = -40; k <= 40; k++) {
      const ox = j * L + k * W, oy = -j * L + k * W;
      if (ox > s + L || oy > s + L || ox < -2 * L || oy < -2 * L) continue;
      plank(ox, oy, L, W, true); plank(ox, oy + W, W, L, false);
    }
  }, { rot: Math.PI / 4 });
}
function borderTex() { // marble inlay band: cream / gold line / slate / gold line / cream
  return canvasTex(1024, 128, (g, w, h) => {
    g.fillStyle = '#EDE6DA'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#B48F55'; g.fillRect(0, h * .2, w, h * .06); g.fillRect(0, h * .74, w, h * .06);
    g.fillStyle = '#5E6A78'; g.fillRect(0, h * .3, w, h * .4);
    for (let x = 0; x < w; x += 64) { g.fillStyle = '#E9DFCB'; g.beginPath(); g.moveTo(x + 32, h * .33); g.lineTo(x + 52, h * .5); g.lineTo(x + 32, h * .67); g.lineTo(x + 12, h * .5); g.fill(); g.fillStyle = '#B48F55'; g.beginPath(); g.arc(x + 32, h * .5, 4, 0, 7); g.fill(); }
  });
}
function stoneTiles() {
  return canvasTex(1024, 1024, (g, s) => {
    const n = 6, t = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = `hsl(33,24%,${72 + (R() - .5) * 6}%)`; g.fillRect(i * t, j * t, t, t); }
    g.strokeStyle = 'rgba(140,120,95,.7)'; g.lineWidth = 3;
    for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * t, 0); g.lineTo(i * t, s); g.stroke(); g.beginPath(); g.moveTo(0, i * t); g.lineTo(s, i * t); g.stroke(); }
  });
}
function rugTex([field, motif, border, accent]) {
  return canvasTex(1024, 768, (g, s, h) => {
    g.fillStyle = field; g.fillRect(0, 0, s, h);
    for (let i = 0; i < 14000; i++) { g.fillStyle = `rgba(80,60,40,${R() * .04})`; g.fillRect(R() * s, R() * h, 2, 2); }
    g.strokeStyle = border; g.lineWidth = s * .05; g.strokeRect(s * .06, h * .06, s * .88, h * .88);
    g.lineWidth = s * .005; g.strokeStyle = motif; g.strokeRect(s * .105, h * .105, s * .79, h * .79); g.strokeRect(s * .025, h * .025, s * .95, h * .95);
    const floret = (x, y, r, col = motif) => { g.save(); g.translate(x, y); g.fillStyle = col; g.globalAlpha = .8; for (let k = 0; k < 6; k++) { g.rotate(Math.PI / 3); g.beginPath(); g.ellipse(r, 0, r, r * .45, 0, 0, 7); g.fill(); } g.globalAlpha = 1; g.fillStyle = accent; g.beginPath(); g.arc(0, 0, r * .45, 0, 7); g.fill(); g.restore(); };
    for (let i = 0; i < 22; i++) { const t = (i + .5) / 22; floret(t * s, h * .06, s * .012, accent); floret(t * s, h * .94, s * .012, accent); floret(s * .06, t * h, s * .012, accent); floret(s * .94, t * h, s * .012, accent); }

    for (let r = 0; r < 5; r++) { g.beginPath(); g.ellipse(0, 0, s * (.24 - r * .04), h * (.2 - r * .034), 0, 0, 7); g.strokeStyle = r % 2 ? border : motif; g.lineWidth = s * .007; g.stroke(); }

  }, { repeat: false });
}
function muralTex() { // chinoiserie garden mural (pink gazebos, palms, peacock) with scalloped top
  return canvasTex(1536, 1024, (g, w, h) => {
    // damask top band
    g.fillStyle = '#E7C3C0'; g.fillRect(0, 0, w, h);
    for (let y = 10; y < h * .4; y += 34) for (let x = (y / 34 % 2) * 20; x < w; x += 40) { g.fillStyle = 'rgba(190,120,125,.55)'; g.beginPath(); g.ellipse(x, y, 7, 11, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(x, y, 13, 4, 0, 0, 7); g.fill(); }
    // scalloped arch opening
    g.save(); g.beginPath(); g.moveTo(0, h * .3);
    const pts = [[0, .3], [.08, .24], [.16, .27], [.25, .19], [.35, .16], [.42, .1], [.5, .08], [.58, .1], [.65, .16], [.75, .19], [.84, .27], [.92, .24], [1, .3]];
    for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; g.quadraticCurveTo((x0 + x1) / 2 * w, Math.min(y0, y1) * h - 30, x1 * w, y1 * h); }
    g.lineTo(w, h); g.lineTo(0, h); g.closePath();

    const sky = g.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#EEF0EA'); sky.addColorStop(.7, '#F4EEE6'); sky.addColorStop(1, '#E9E2D6'); g.fillStyle = sky; g.fillRect(0, 0, w, h);
    g.filter = 'blur(6px)';
    for (let k = 0; k < 3; k++) { g.fillStyle = ['rgba(190,205,195,.6)', 'rgba(170,190,178,.6)', 'rgba(150,175,160,.55)'][k]; g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w; x += 24) g.lineTo(x, h * (.55 + k * .08) + Math.sin(x * .01 + k * 2) * 30); g.lineTo(w, h); g.fill(); }
    g.filter = 'none';
    const palm = (x, base, hgt, s) => {
      g.strokeStyle = '#8D7A63'; g.lineWidth = 7 * s; g.beginPath(); g.moveTo(x, base); g.quadraticCurveTo(x + 30 * s, base - hgt * .5, x + 10 * s, base - hgt); g.stroke();

        for (let k = 1; k < 14; k++) { const t = k / 14, px = tx + (ex - tx) * t, py = ty + (ey - ty) * t - Math.sin(t * Math.PI) * 40 * s; g.lineWidth = 2 * s; g.beginPath(); g.moveTo(px, py); g.lineTo(px + 10 * s, py + 22 * s); g.moveTo(px, py); g.lineTo(px - 10 * s, py + 22 * s); g.stroke(); }
      }
    };

let mode = 'doll', cut = 5.2, tween = null, current = 'overview', photo = false;

const clock = new THREE.Clock();

  requestAnimationFrame(tick);
}
